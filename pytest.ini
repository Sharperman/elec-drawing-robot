[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage settings (used by pytest-cov)
# Run: pytest --cov=backend --cov-report=html
[coverage:run]
source = backend
omit =
    */__pycache__/*
    */migrations/*
    backend/alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
show_missing = True
fail_under = 0  # CI sets --cov-fail-under dynamically
